[home]
enabled = true
includeReadme = false

#navbar
[[navbar.items]]
href = "https://discord.gg/Ebbp9UgBUD"
label = "Discord"
position = "right"

#features
[[home.features]]
title = "Easy sound fetching"
description = "Build your sounds once in Studio and fetch them by name anywhere, with automatic SoundGroups and no repetitive manual wiring."

[[home.features]]
title = "Clean memory behavior"
description = "VluxySF stores lightweight sound definitions and creates sounds on demand, so you avoid keeping large trees of Sound instances around."

[[home.features]]
title = "Built for scale"
description = "The schema is compiled once into a compact buffer and replicates with the place, so clients start without a round trip and servers do no work per player, even with thousands of sounds."

[[home.features]]
title = "Extra tooling"
description = "Presets, jitter, preloading, and warming come built in."
